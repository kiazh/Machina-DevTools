name: Tests

# Runs the Machina backend suite (moved here from Machina-Harness) against a
# checked-out Machina-Harness. Action pins mirror the harness CI convention:
# every action is pinned to a commit SHA with the version in the comment, and
# the Postgres service image is pinned to tag@digest. Do not rewrite these to
# moving tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      harness_ref:
        description: "Machina-Harness ref to test against"
        default: main
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MACHINA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test

    steps:
      - name: Checkout Machina-DevTools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout Machina-Harness (source under test)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kiazh/Machina-Harness
          ref: ${{ github.event.inputs.harness_ref || 'main' }}
          path: Machina-Harness

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Machina + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "Machina-Harness[dev,connectors]"

      - name: Link harness artifacts for path-coupled tests
        env:
          MACHINA_REPO: ${{ github.workspace }}/Machina-Harness
        run: ./bootstrap-links.sh "$MACHINA_REPO"

      - name: Run backend suite
        env:
          MACHINA_REPO: ${{ github.workspace }}/Machina-Harness
        run: |
          python -m pytest tests/ -q -p no:cacheprovider -m "not ui_integration and not workflow_trial"
